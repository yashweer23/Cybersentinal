# Explicit opt-in only: docker compose -f docker-compose.yml -f compose.dev.yml up --build -d
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
  backend:
    build:
      target: development
    read_only: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
  frontend:
    build:
      target: development
    read_only: false
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
      FRONTEND_DEV_PORT: "8080"
      WATCH_USE_POLLING: "true"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.js:/app/frontend/vite.config.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
